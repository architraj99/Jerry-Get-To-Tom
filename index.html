<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#4d351f">
        <title>Jerry! Get To Tom</title>
        <link rel="icon" href="assets/cheese.png" type="image/png">
        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/story.css">
        <link rel="stylesheet" href="css/game.css">
        <script src="js/level.js" defer></script>
        <script src="js/input.js" defer></script>
        <script src="js/fullscreen.js" defer></script>
        <script src="js/game.js" defer></script>
        <script src="js/story.js" defer></script>
        <script src="js/main.js" defer></script>
    </head>
    <body>
        <main>
            <section id="game-view" aria-label="Tom and Jerry rescue game" hidden>
                <div id="game-stage">
                    <canvas id="game" width="960" height="540" tabindex="0" aria-label="Move Jerry with arrow keys or A and D. Jump with up, W or space. Reach Tom before time runs out."></canvas>
                    <div class="hud">
                        <span id="time">TIME 45.0</span>
                        <span id="cheese-count">CHEESE 0/7</span>
                    </div>
                    <div id="penalty" aria-live="polite"></div>
                </div>
                <div id="touch-controls" aria-label="Touch Controls">
                    <div class="direction-controls">
                        <button type="button" data-control="left" aria-label="Move left">LEFT</button>
                        <button type="button" data-control="right" aria-label="Move right">RIGHT</button>
                    </div>
                    <button type="button" data-control="jump" aria-label="Jump">JUMP</button>
                </div>
            </section>

            <section id="story-screen" class="screen" aria-labelledby="story-title">
                <div class="paper">
                    <h1 id="story-title" tabindex="-1">JERRY!</h1>
                    <h2>TOM IS IN DANGER.</h2>
                    <p>He is badly hurt and needs his medicine.</p>
                    <p>You're the only one who can reach him in time.</p>
                    <button id="accept" type="button">YEAH, I'LL DO IT</button>
                </div>
            </section>

            <section id="instructions-screen" class="screen" aria-labelledby="instructions-title" hidden>
                <div class="paper instructions-paper">
                    <h1 id="instructions-title" tabindex="-1">GET TO TOM IN TIME</h1>
                    <dl class="controls-list">
                        <div><dt>MOVE</dt><dd><span>← →</span><span>A D</span></dd></div>
                        <div><dt>JUMP</dt><dd><span>↑</span><span>W</span><span>SPACE</span></dd></div>
                    </dl>
                    <p>Avoid spikes and gaps.<br>Reach Tom before the timer ends.</p>
                    <p class="time-limit">TIME: 45 SECONDS</p>
                    <button id="play" type="button" disabled>PLAY</button>
                    <p id="asset-status" role="status">Loading...</p>
                </div>
            </section>

        </main>
    </body>
</html>
